name: Deploy Edge Functions

# Auto-deploy the rain-alerts Edge Function whenever its source lands on main.
#
# Note: merging THIS workflow file does not trigger a deploy — it doesn't touch
# supabase/functions/**. The next push to main that changes a function does.
# Use the manual "Run workflow" button (workflow_dispatch) for the first deploy
# or a re-sync once the secrets below are set.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  Supabase personal access token (account -> tokens);
#                          the CLI authenticates with it (no `supabase login`).
#   SUPABASE_PROJECT_ID    The project ref, e.g. uyednvctjudnrpheubyv.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

# One deploy at a time; never cancel an in-flight deploy mid-upload.
concurrency:
  group: deploy-edge-functions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy check-rain-alerts
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy check-rain-alerts
        # --no-verify-jwt preserves verify_jwt=false: the function authenticates
        # callers itself via the x-cron-secret / CRON_SECRET header, so Supabase's
        # gateway must NOT require a JWT — that would reject the pg_cron caller.
        run: |
          supabase functions deploy check-rain-alerts \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --no-verify-jwt

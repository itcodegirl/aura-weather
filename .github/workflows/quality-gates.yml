name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # shell: bash is load-bearing, not decoration. The default run shell is
      # `bash -e` without pipefail, so a pipeline reports tee's exit code --
      # a failing suite would be piped into a passing step. `shell: bash`
      # gets `-eo pipefail`.
      - name: Unit tests
        shell: bash
        run: npm test | tee /tmp/unit.tap

      - name: Component render tests
        shell: bash
        run: npm run test:components | tee /tmp/render.tap

      # The README states counts about this repo. Reuse the TAP the two steps
      # above already produced rather than running either suite a third time.
      - name: Documented numbers still true
        run: npm run check:docs -- --unit /tmp/unit.tap --render /tmp/render.tap

      - name: Production build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: aura-weather-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser-quality:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Install fonts for consistent text rendering
        run: sudo apt-get install -y fonts-liberation

      - name: Playwright E2E and accessibility checks
        run: npm run test:e2e -- --workers=1

      - name: Upload regenerated README screenshots
        # The capture specs write under test-results/captures/ rather than
        # over the tracked files (see e2e/support/capturePath.js), so the
        # checkout stays clean and this artifact is the way to pick up a
        # refreshed set. The paths inside mirror their repo locations, so a
        # download unzips straight over the working tree.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-contract-screenshots
          path: test-results/captures/**/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  lighthouse-budget:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Lighthouse budgets
        run: npm run test:lighthouse

      - name: Upload Lighthouse artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-artifacts
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  record-trust-contract-demo:
    # Manual only: trigger from the Actions tab ("Run workflow") when the
    # missing-data UI has changed and docs/screenshots/trust-contract-demo.webm
    # needs re-recording. Recording needs a Chromium plus Playwright's bundled
    # ffmpeg, which is why this runs here rather than on a developer laptop.
    # Download the `trust-contract-demo` artifact, watch the clip, copy it over
    # docs/screenshots/trust-contract-demo.webm, and commit on a branch, so a
    # human has watched the recording before it ships.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser, ffmpeg, and system dependencies
        run: npx playwright install --with-deps chromium ffmpeg

      - name: Install fonts so the recording matches the committed screenshots
        run: sudo apt-get install -y fonts-liberation

      - name: Record the trust-contract demo
        # The recording is ~10s of browsing. If it has not finished in five
        # minutes something is stuck (it once hung indefinitely on a dev server
        # that outlived its parent) and the job must say so, not idle.
        timeout-minutes: 5
        run: npm run record:trust-contract-demo

      - name: Upload the recording
        uses: actions/upload-artifact@v4
        with:
          name: trust-contract-demo
          path: docs/screenshots/trust-contract-demo.webm
          if-no-files-found: error
          retention-days: 14

name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Component render tests
        run: npm run test:components

      - name: Production build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: aura-weather-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser-quality:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Install fonts for consistent text rendering
        run: sudo apt-get install -y fonts-liberation

      - name: Playwright E2E and accessibility checks
        run: npm run test:e2e -- --workers=1

      - name: Upload regenerated README screenshots
        # The Playwright run regenerates docs/screenshots in place. Nothing
        # gates on them any more, but the artifact is still the convenient
        # way to pick up a refreshed set when the README images are worth
        # updating by hand.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-contract-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  lighthouse-budget:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Lighthouse budgets
        run: npm run test:lighthouse

      - name: Upload Lighthouse artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-artifacts
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  record-trust-contract-demo:
    # Manual only: trigger from the Actions tab ("Run workflow") when the
    # missing-data UI has changed and docs/screenshots/trust-contract-demo.webm
    # needs re-recording. Recording needs a Chromium plus Playwright's bundled
    # ffmpeg, which is why this runs here rather than on a developer laptop.
    # Download the `trust-contract-demo` artifact, watch the clip, copy it over
    # docs/screenshots/trust-contract-demo.webm, and commit on a branch, so a
    # human has watched the recording before it ships.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser, ffmpeg, and system dependencies
        run: npx playwright install --with-deps chromium ffmpeg

      - name: Install fonts so the recording matches the committed screenshots
        run: sudo apt-get install -y fonts-liberation

      - name: Record the trust-contract demo
        # The recording is ~10s of browsing. If it has not finished in five
        # minutes something is stuck (it once hung indefinitely on a dev server
        # that outlived its parent) and the job must say so, not idle.
        timeout-minutes: 5
        run: npm run record:trust-contract-demo

      - name: Upload the recording
        uses: actions/upload-artifact@v4
        with:
          name: trust-contract-demo
          path: docs/screenshots/trust-contract-demo.webm
          if-no-files-found: error
          retention-days: 14

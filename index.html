<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      Two colour schemes since Instrument step 4. Dark is the default and
      carries the weather-scene gradient; light is a flat ground with no
      sky and follows the system setting only (prefers-color-scheme).
      "light dark" lets the UA adapt form widgets and scrollbars to
      whichever is active — the frosted cards that once made half-light
      read as a bug are gone (step 2), so the old "dark only" stance no
      longer applies. theme-color is declared per scheme so the browser
      chrome matches the ground.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070a10" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e4e9ef" />
    <meta name="application-name" content="Aura Weather" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aura Weather" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Aura - Atmospheric Intelligence</title>
    <meta
      name="description"
      content="Aura is a modern weather dashboard with real-time atmospheric data, adaptive visuals, and a polished bento-grid interface built with React and Vite."
    />

    <meta property="og:title" content="Aura - Atmospheric Intelligence" />
    <meta
      property="og:description"
      content="A polished weather dashboard with real-time atmospheric insights, adaptive gradients, and portfolio-ready UI craftsmanship."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aura Weather" />
    <!--
      Both of these name production even when this document is served from a
      deploy preview, and that is deliberate. A preview is the same content at
      a throwaway URL: pointing them at the preview host would let a shared
      preview card resolve to a URL that stops existing when the branch is
      deleted, and would offer search engines a second address for one page.
      The canonical link is what says which of those addresses is the real
      one; the audit found og:url carrying that job alone, with no canonical
      to back it (O-14).
    -->
    <link rel="canonical" href="https://aura-weather-platform.netlify.app/" />
    <meta property="og:url" content="https://aura-weather-platform.netlify.app/" />
    <!--
      Social crawlers resolve og:image without a base URL, so the image
      reference must be absolute — a relative path renders as a blank
      card on most platforms.
    -->
    <meta
      property="og:image"
      content="https://aura-weather-platform.netlify.app/og-image.png"
    />
    <meta
      property="og:image:alt"
      content="Aura Weather dashboard showing current conditions and the hourly outlook"
    />
    <meta property="og:image:type" content="image/png" />
    <!--
      og-image.png is a 1200x630 dashboard render captured by
      e2e/social-pwa-assets.spec.js (regenerate via `npm run
      screenshots`), so the large-card crop is native, not letterboxed.
    -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aura - Atmospheric Intelligence" />
    <meta
      name="twitter:description"
      content="A polished weather dashboard with real-time atmospheric insights and adaptive visuals."
    />
    <meta
      name="twitter:image"
      content="https://aura-weather-platform.netlify.app/og-image.png"
    />

    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://geocoding-api.open-meteo.com" crossorigin />
    <!--
      AQI and NWS alerts are fetched immediately after the first
      forecast response, so a full preconnect (DNS + TCP + TLS) saves a
      round-trip on first load. Archive and reverse-geocode hosts stay
      dns-prefetch only — those calls are deferred or opt-in.
    -->
    <link rel="preconnect" href="https://air-quality-api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://api.weather.gov" crossorigin />
    <link rel="dns-prefetch" href="https://archive-api.open-meteo.com" />
    <link rel="dns-prefetch" href="https://api.bigdatacloud.net" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Inter-Variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/IBMPlexMono-Medium.woff2" crossorigin />
    <style>
      /* Inter — variable (weights 100–900), latin. Carries the prose:
         conditions, readings, body copy, card titles. The hero numeral
         used to rely on this face's weight 200; it is set in the mono
         face now, so nothing left needs a weight below 400 — the range
         stays declared because the variable file ships it either way. */
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/fonts/Inter-Variable.woff2') format('woff2'); }
      /* IBM Plex Mono — three static weights, subset (see
         /fonts/LICENSES.md for the ranges and the OFL notice). Carries
         measured values and their labels; prose stays in Inter. Only
         Medium is preloaded: it is the weight the hero reading paints,
         and 400/600 arrive before anything below the fold is read. */
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/IBMPlexMono-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/IBMPlexMono-Medium.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/IBMPlexMono-SemiBold.woff2') format('woff2'); }
    </style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:34rem;margin:18vh auto 0;padding:24px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#e8eefc;text-align:center;line-height:1.5;">
        <h1 style="font-size:1.4rem;margin:0 0 8px;">Aura Weather needs JavaScript</h1>
        <p style="margin:0;color:#aebbd8;">This dashboard renders live forecast, air-quality, and severe-weather data in the browser. Please enable JavaScript to continue.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
